name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch: # Allows manual triggering
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v1.0.0)'
        required: true
        default: 'master'

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Combined into one step

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --prefer-dist

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # Ensure this secret name matches exactly what you saved in GitHub
          ssh-private-key: ${{ secrets.DEPLOY_SSH_SECRET }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_IP }} >> ~/.ssh/known_hosts

      - name: Execute Envoy Deployment
        run: |
          DEPLOY_TAG=${{ github.event.inputs.tag || github.event.release.tag_name }}

          ./vendor/bin/envoy run deploy \
            -v tag=$DEPLOY_TAG \
            --server=${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_IP }} \
            -v path=${{ secrets.DEPLOY_PATH }}
