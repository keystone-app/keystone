name: Deploy to Production

on:
  release:
    types: [published]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Combined into one step

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: envoy

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # Ensure this secret name matches exactly what you saved in GitHub
          ssh-private-key: ${{ secrets.DEPLOY_SSH_SECRET }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_IP }} >> ~/.ssh/known_hosts

      - name: Execute Envoy Deployment
        run: |
          envoy run deploy \
            -v tag=${{ github.event.release.tag_name }} \
            -v server=${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_IP }} \
            -v path=${{ secrets.DEPLOY_PATH }}
